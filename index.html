<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>David & Melanie's house</title>
<style>:root {
  --bg: #f4f2ee; --paper: #fbfaf7; --ink: #1d2330; --muted: #667085; --line: #d9d5cc; --card: #ffffff;
  --accent: #2563eb; --accent-ink: #ffffff; --wall: #2b3140; --walltop: #2b3140; --glass: #5aa7e0;
  --stair: #8a6f4e; --case: #b9b2a5; --dim: #7a4a12; --sel: #f59e0b; --shadow: 0 6px 24px rgba(20, 24, 40, .14);
  --ruler: #d6336c; --stairbg: #eee8de; --casebg: #e4e0d7;
}
:root[data-theme="dark"] {
  --bg: #0f131a; --paper: #151a23; --ink: #e7eaf0; --muted: #98a2b3; --line: #2a3140; --card: #1a202b;
  --accent: #4f8cff; --accent-ink: #08101f; --wall: #dfe4ee; --walltop: #dfe4ee; --glass: #7cc4ff;
  --stair: #c9a878; --case: #6b6558; --dim: #f2b46b; --sel: #fbbf24; --shadow: 0 6px 24px rgba(0, 0, 0, .5);
  --ruler: #ff6b9d; --stairbg: #2b2a28; --casebg: #33322f;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
button { font: inherit; color: inherit; }
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

#bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top));
  background: var(--card); border-bottom: 1px solid var(--line); flex-wrap: wrap; z-index: 5; }
.brand { margin-right: auto; min-width: 0; }
.brand h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#subtitle { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tool { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 6px 11px;
  cursor: pointer; font-weight: 600; font-size: 14px; }
.tool[aria-pressed="true"] { background: var(--ruler); border-color: var(--ruler); color: #fff; }
#panelBtn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--card); }

#main { flex: 1; display: flex; min-height: 0; }
#stage { position: relative; flex: 1; min-width: 0; overflow: hidden; background: var(--paper); touch-action: none; user-select: none; -webkit-user-select: none; }
#plan, #gl, #over { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#over { pointer-events: none; }
#gl { outline: none; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.l3 { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; text-align: center; line-height: 1.15;
  font-size: 12.5px; font-weight: 700; color: var(--ink); text-shadow: 0 0 3px var(--paper), 0 0 3px var(--paper), 0 0 6px var(--paper); }
.l3 small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); }
.l3.floor { font-size: 13px; z-index: 2; background: var(--ink); color: var(--card); padding: 3px 9px; border-radius: 999px; text-shadow: none; font-weight: 700; }
.l3.dim { font-size: 11px; font-weight: 600; color: var(--dim); background: var(--paper); background: color-mix(in srgb, var(--paper) 82%, transparent); padding: 0 4px; border-radius: 4px; text-shadow: none; }
.l3.tag { font-size: 10.5px; font-weight: 600; color: var(--muted); }
.l3.pick { z-index: 3; }
.l3.dim.pick { font-size: 12px; font-weight: 700; color: #1d2330; background: var(--sel); padding: 1px 5px; border-radius: 5px; }

#chips { position: absolute; left: 10px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 20px); padding-bottom: env(safe-area-inset-bottom); }
.chip { border: 1px solid var(--line); background: var(--card); background: color-mix(in srgb, var(--card) 92%, transparent); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 600;
  cursor: pointer; color: var(--muted); backdrop-filter: blur(6px); }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); background: var(--card); }
.chip[aria-pressed="true"]::before { content: "✓ "; color: var(--accent); }
#viewctl { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
#viewctl button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: 18px; font-weight: 600;
  display: grid; place-items: center; box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
#viewctl button.wide { font-size: 11px; line-height: 1.05; }
#threed { position: absolute; right: 56px; top: 10px; display: none; flex-direction: column; gap: 8px; background: var(--card); background: color-mix(in srgb, var(--card) 94%, transparent);
  border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; font-size: 12.5px; backdrop-filter: blur(6px); max-width: 220px; }
#threed label { display: flex; align-items: center; gap: 8px; justify-content: space-between; color: var(--muted); font-weight: 600; }
#threed input[type=range] { width: 110px; accent-color: var(--accent); }
#threed .seg button { padding: 3px 8px; font-size: 12.5px; }
body[data-dim="3d"] #threed { display: flex; }
#hint { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: var(--ink); color: var(--card); border-radius: 999px; padding: 6px 14px; font-size: 13px;
  font-weight: 600; pointer-events: none; opacity: 0; transition: opacity .2s; max-width: calc(100% - 130px); text-align: center; }
#hint.on { opacity: .94; }
/* what sits on the picture and speaks about it: the picked room's sizes, the ruler's readings */
#dock { position: absolute; left: 10px; top: 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; max-width: min(340px, calc(100% - 70px)); pointer-events: none; }
#dock > * { pointer-events: auto; max-width: 100%; box-sizing: border-box; }
#roominfo { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--sel); border-radius: 12px; box-shadow: var(--shadow); padding: 7px 8px 8px 10px; font-size: 13px; min-width: 240px; }
#roominfo .top { display: flex; align-items: center; gap: 6px; }
#roominfo .top b { font-size: 14.5px; white-space: nowrap; }
#roominfo .top .k { flex: 1; min-width: 0; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#roominfo button { flex: none; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 4px 9px; cursor: pointer; font-size: 12.5px; font-weight: 600; }
#roominfo .more { color: var(--accent); }
#roominfo .nums { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 12px; margin-top: 3px; font-variant-numeric: tabular-nums; }
#roominfo .nums b { font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
#roominfo .nums span { font-size: 14px; font-weight: 600; }
#roominfo .nums span + span { color: var(--muted); font-weight: 500; }
#readout { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 8px 10px; font-size: 13px; }
#readout h4 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ruler); }
#readout .m { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; padding: 2px 0; }
#readout .m b { font-size: 16px; font-variant-numeric: tabular-nums; }
#readout .m span { color: var(--muted); font-size: 12px; }
#readout button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 3px 9px; cursor: pointer; font-size: 12.5px; font-weight: 600; margin-top: 5px; margin-right: 4px; }
#scalebar { position: absolute; right: 10px; bottom: 10px; font-size: 11px; color: var(--muted); display: flex; flex-direction: column; align-items: flex-end; gap: 2px; pointer-events: none; padding-bottom: env(safe-area-inset-bottom); }
#scalebar i { display: block; height: 5px; border: 1.5px solid var(--muted); border-top: 0; }
body[data-dim="3d"] #scalebar, body[data-dim="3d"] #front { display: none; }
#front { position: absolute; left: 50%; top: 46px; transform: translateX(-50%); font-size: 11px; color: var(--muted); letter-spacing: .04em; pointer-events: none; display: none; }

/* the drawing */
#plan { cursor: grab; }
#plan.drag { cursor: grabbing; }
body.ruler #plan, body.ruler #gl { cursor: crosshair; }
#plan text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; pointer-events: none; }
.wall { fill: var(--wall); }
.room { stroke: none; cursor: pointer; }
.room:hover { filter: brightness(.965); }
.room.sel { stroke: var(--sel); stroke-width: 5; stroke-linejoin: round; paint-order: stroke; }
.rname { font-weight: 700; fill: var(--ink); text-anchor: middle; }
.rsub { fill: var(--muted); text-anchor: middle; }
.rarea { fill: var(--ink); text-anchor: middle; font-weight: 600; }
.dimt { fill: var(--dim); text-anchor: middle; font-weight: 600; paint-order: stroke; stroke: var(--paper); stroke-width: 2.4; stroke-linejoin: round; }
.diml { stroke: var(--dim); stroke-width: 1.1; fill: none; }
.win { fill: var(--paper); stroke: var(--wall); stroke-width: 1.2; }
.wing { stroke: var(--glass); stroke-width: 2.2; fill: none; }
.leaf { stroke: var(--wall); stroke-width: 3; stroke-linecap: round; fill: none; }
.arc { stroke: var(--wall); stroke-width: 1; fill: none; stroke-dasharray: 5 5; opacity: .75; }
.shut { fill: var(--paper); stroke: var(--wall); stroke-width: 1.4; }
.thresh { stroke: var(--wall); stroke-width: 1; stroke-dasharray: 4 5; opacity: .6; fill: none; }
.tread { stroke: var(--stair); stroke-width: 1.4; fill: none; }
.stairbg { fill: var(--stairbg); fill: color-mix(in srgb, var(--stair) 14%, var(--paper)); }
.well { fill: url(#hatch); }
.stairt { fill: var(--stair); font-weight: 700; text-anchor: middle; paint-order: stroke; stroke: var(--stairbg); stroke-width: 5; stroke-linejoin: round; }
.arrow { stroke: var(--stair); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.case { fill: var(--casebg); fill: color-mix(in srgb, var(--case) 34%, var(--paper)); stroke: var(--case); stroke-width: 1.2; }
.caset { fill: var(--muted); text-anchor: middle; font-style: italic; }
.rail { stroke: var(--stair); stroke-width: 2.4; fill: none; stroke-dasharray: 9 4 2 4; }
.ftitle { font-weight: 800; fill: var(--ink); text-anchor: middle; letter-spacing: .01em; }
.fsub { fill: var(--muted); text-anchor: middle; }
.oline { stroke: var(--muted); stroke-width: 1; fill: none; }
.otext { fill: var(--muted); text-anchor: middle; font-weight: 600; paint-order: stroke; stroke: var(--paper); stroke-width: 9; stroke-linejoin: round; }
.gridl { stroke: var(--line); stroke-width: .8; }
.rul { stroke: var(--ruler); stroke-width: 2.5; fill: none; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.rulp { fill: var(--ruler); stroke: #fff; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.rult { fill: #fff; font-weight: 700; text-anchor: middle; }
.rulb { fill: var(--ruler); }
.snap { fill: none; stroke: var(--ruler); stroke-width: 2; vector-effect: non-scaling-stroke; }

/* the panel */
#panel { width: 380px; max-width: 46vw; background: var(--card); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
body:not(.panel) #panel { display: none; }
#tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 6px; gap: 2px; flex: none; overflow-x: auto; }
#tabs button { border: 0; background: none; padding: 11px 10px 9px; cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--muted); border-bottom: 2.5px solid transparent; white-space: nowrap; }
#tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
#tabbody { overflow: auto; padding: 14px 16px 28px; flex: 1; -webkit-overflow-scrolling: touch; }
#tabbody h2 { font-size: 15px; margin: 18px 0 6px; }
#tabbody h2:first-child { margin-top: 0; }
#tabbody h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 6px; font-weight: 700; }
#tabbody p { margin: 6px 0; }
#tabbody .note { color: var(--muted); font-size: 13px; }
.big { font-size: 26px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.big small { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.t th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 4px 6px 4px 0; border-bottom: 1px solid var(--line); }
table.t td { padding: 5px 6px 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t td.n, table.t th.n { text-align: right; padding-right: 0; padding-left: 10px; white-space: nowrap; }
table.t tr.sub td { color: var(--muted); font-size: 12.5px; }
table.t tr.sub td:first-child { padding-left: 14px; }
table.t tr.tot td { font-weight: 700; border-bottom: 0; }
table.t tr.pick { cursor: pointer; }
table.t tr.pick:hover td { background: rgba(37, 99, 235, .08); }
table.t tr.cur td { background: rgba(245, 158, 11, .22); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: 0; border: 1px solid rgba(0, 0, 0, .15); }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 8px 0; background: var(--paper); }
.card h4 { margin: 0 0 2px; font-size: 14.5px; }
.card .k { color: var(--muted); font-size: 12.5px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13.5px; margin: 6px 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 9px; padding: 7px 11px; cursor: pointer; font-weight: 600; font-size: 13.5px; margin: 3px 4px 3px 0; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.fix { border-left: 3px solid var(--sel); padding: 2px 0 2px 10px; margin: 10px 0; }
.fix b { display: block; }
.fix .was { color: var(--muted); font-size: 13px; }
.fix .now { font-size: 13px; }
.leg { display: grid; grid-template-columns: 46px 1fr; gap: 6px 10px; align-items: center; font-size: 13px; }
.leg svg { width: 46px; height: 20px; }
details.more { margin: 8px 0; }
details.more summary { cursor: pointer; font-weight: 600; color: var(--accent); font-size: 13.5px; }

@media (max-width: 760px) {
  #main { flex-direction: column; }
  #panel { width: auto; max-width: none; border-left: 0; border-top: 1px solid var(--line); height: 48%; flex: none; }
  #bar { gap: 6px; padding: 6px 8px; padding-top: max(6px, env(safe-area-inset-top)); }
  .brand { order: 0; flex: 1 1 60%; }
  .brand h1 { font-size: 15px; }
  #subtitle { font-size: 11px; }
  #rulerBtn { order: 1; } #panelBtn { order: 2; }
  #floorSeg { order: 3; flex: 1 1 auto; } #dimSeg { order: 4; }
  #floorSeg button { flex: 1 1 auto; }
  .tool { padding: 6px 9px; }
  .tool span { display: none; }
  .seg button { padding: 6px 7px; font-size: 13px; }
  #chips { left: 0; right: 0; bottom: 0; max-width: none; flex-wrap: nowrap; overflow-x: auto; padding: 0 8px max(8px, env(safe-area-inset-bottom)); scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  #chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; }
  #scalebar { bottom: 46px; }
  #stage.docked #scalebar { display: none; }      /* its place is taken */
  #hint { top: auto; bottom: calc(52px + var(--lift, 0px)); font-size: 12px; padding: 5px 11px; max-width: calc(100% - 24px); }
  #viewctl { right: 8px; top: 8px; }
  #threed { left: 8px; right: auto; top: 8px; max-width: calc(100% - 64px); padding: 6px 8px; gap: 6px; }
  #threed input[type=range] { width: 96px; }
  #dock { top: auto; bottom: 50px; left: 8px; right: 8px; max-width: none; flex-direction: column-reverse; }   /* a thumb's reach: above the row of switches */
  #roominfo { align-self: stretch; min-width: 0; }
  #roominfo button { padding: 7px 12px; font-size: 13px; }
}

/* paper */
#print { display: none; }
@media print {
  @page { size: letter portrait; margin: 12mm; }
  html, body { height: auto; background: #fff; }
  #app { display: none !important; }
  #print { display: block; color: #111; font: 10.5pt/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .sheet { page-break-after: always; break-after: page; }
  .sheet:last-child { page-break-after: auto; break-after: auto; }
}
#print { --stairbg: #f1ece4; --casebg: #e6e3dc; --bg: #fff; --paper: #fff; --ink: #111827; --muted: #5b6474; --line: #cfd4dc; --card: #fff; --wall: #1f2937; --glass: #3b82c4; --stair: #7a5c36;
  --case: #9a958a; --dim: #7a4a12; --sel: #f59e0b; }
.sheet { position: relative; height: 252mm; overflow: hidden; }
.sheet h1 { font-size: 22pt; margin: 0 0 2mm; letter-spacing: -.01em; }
.sheet h2 { font-size: 15pt; margin: 0 0 1mm; }
.sheet h3 { font-size: 8.4pt; text-transform: uppercase; letter-spacing: .06em; color: #5b6474; margin: 3.4mm 0 1mm; }
.sheet .lead { color: #5b6474; margin: 0 0 4mm; }
.sheet svg text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
.sheet table { width: 100%; border-collapse: collapse; font-size: 8.6pt; font-variant-numeric: tabular-nums; line-height: 1.25; }
.sheet th { text-align: left; font-weight: 600; color: #5b6474; font-size: 7.8pt; border-bottom: .6pt solid #9aa3b2; padding: .7mm 2mm .7mm 0; }
.sheet td { border-bottom: .4pt solid #d5d9e0; padding: .7mm 2mm .7mm 0; vertical-align: top; }
.sheet .fine { font-size: 7.6pt; line-height: 1.3; color: #3f4756; margin: 0; }
.sheet .big-t table { font-size: 9.5pt; }
.sheet .big-t td, .sheet .big-t th { padding: 1.1mm 2mm 1.1mm 0; }
.sheet td.n, .sheet th.n { text-align: right; white-space: nowrap; }
.sheet tr.sub td { color: #5b6474; }
.sheet tr.sub td:first-child { padding-left: 4mm; }
.sheet tr.tot td { font-weight: 700; border-bottom: 0; }
.sheet .cols { display: flex; gap: 8mm; align-items: flex-start; }
.sheet .cols > div { flex: 1; min-width: 0; }
.sheet .foot { position: absolute; left: 0; right: 0; bottom: 0; font-size: 8pt; color: #7b8494; display: flex; justify-content: space-between; }
.sheet .fix { border-left: 2pt solid #f59e0b; padding-left: 3mm; margin: 2.5mm 0; break-inside: avoid; }
.sheet .fix b { display: block; }
.sheet .fix .was { color: #5b6474; }
.sheet small { color: #5b6474; }
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <div class="brand">
      <h1 id="title"></h1>
      <div id="subtitle"></div>
    </div>
    <div class="seg" id="floorSeg" role="group" aria-label="Floor"></div>
    <div class="seg" id="dimSeg" role="group" aria-label="View">
      <button type="button" data-dim="2d">2D</button><button type="button" data-dim="3d">3D</button>
    </div>
    <button type="button" id="rulerBtn" class="tool" title="Measure between two points (R)">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 17 17 3l4 4L7 21z M7 13l2 2 M10 10l2 2 M13 7l2 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <span>Ruler</span>
    </button>
    <button type="button" id="panelBtn" class="tool" title="Rooms, sizes and everything else">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Details</span>
    </button>
  </header>
  <div id="main">
    <div id="stage">
      <svg id="plan" xmlns="http://www.w3.org/2000/svg"></svg>
      <canvas id="gl"></canvas>
      <svg id="over" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="labels"></div>
      <div id="chips" role="group" aria-label="Show"></div>
      <div id="viewctl"></div>
      <div id="threed"></div>
      <div id="dock">
        <div id="roominfo" hidden></div>
        <div id="readout" hidden></div>
      </div>
      <div id="hint"></div>
      <div id="scalebar"><span></span><i></i></div>
      <div id="front">front of the house ▲</div>
    </div>
    <aside id="panel" aria-label="Details">
      <div id="tabs" role="tablist"></div>
      <div id="tabbody"></div>
    </aside>
  </div>

const $ = id => document.getElementById(id);

}

// ---- colours ---------------------------------------------------------------------------------

const HALL = "#ebe8e1";
function colourFor(r, k) {
  const w = (r.what || "").toLowerCase();
  if (/^hall|landing/.test(w)) return HALL;
  if (/bath|powder/.test(w)) return "#c8ebe5";
  if (/utility|furnace/.test(w)) return "#e3dfd5";
  if (/living|kitchen|dining/.test(w)) return "#fbeecb";

      r.color = colourFor(r, k);
      if (PALETTE.includes(r.color)) k++;

  const a = el("a", { href: URL.createObjectURL(blob), download: name });

"use strict";
// The plan as a drawing (SVG). One sheet unit is one centimetre of the house, so text and line

const Plan2D = (function () {

    }));

    return h + '<tr class="tot"><td>In rooms</td><td></td><td class="n">' + fmtArea(f.area_rooms) + "</td></tr>";
  }
  function buildPrint() {
    const P = $("print"); P.innerHTML = "";
    const sheets = [], top = M.floors[M.floors.length - 1], sh = M.house.shaft;
    const sheet = () => { const d = el("div", { class: "sheet" }); P.appendChild(d); sheets.push(d); return d; };
    // 1: the house
    let d = sheet();
    d.appendChild(el("h1", { text: M.house.title }));
    d.appendChild(el("p", { class: "lead", text: "Floor plans measured with a laser scanner (lidar) on " + M.house.scanned + ". " + M.floors.length + " floors, " + fmtArea(total("area_rooms"), null, 0) + " in rooms." }));
    const pic = has3d ? GL3D.snapshot(1800, 1080, { floor: "all", walls: "half", apart: 2.6 }) : null;
    if (pic) d.appendChild(el("img", { src: pic, style: "width:100%;display:block;margin:0 0 2mm", alt: "The three floors, drawn apart" }));
    else d.appendChild(sheetSvg(M.floors.slice().reverse(), { names: true, dims: false, doors: false, casework: true, scan: false, grid: false }, 150, true).svg);
    let h = '<h3>The house</h3><table><tr><th>Floor</th><th class="n">Rooms</th><th class="n">In rooms</th><th class="n">Inside the outside walls</th><th class="n">Ceiling</th></tr>';
    for (const f of M.floors.slice().reverse()) h += "<tr><td>" + esc(f.name) + '</td><td class="n">' + f.rooms.filter(r => !r.of).length + '</td><td class="n">' + fmtArea(f.area_rooms, null, 0) + '</td><td class="n">' + fmtArea(f.area_inside, null, 0) + '</td><td class="n">' + fmtLen(f.ceiling) + "</td></tr>";
    h += '<tr class="tot"><td>House</td><td class="n">' + M.floors.reduce((s, f) => s + f.rooms.filter(r => !r.of).length, 0) + '</td><td class="n">' + fmtArea(total("area_rooms"), null, 0) + '</td><td class="n">' + fmtArea(total("area_inside"), null, 0) + "</td><td></td></tr></table>";
    h += '<div class="cols"><div><h3>Size</h3><table><tr><td>Inside, across</td><td class="n">' + fmtLenBoth(HW).join(" · ") + '</td></tr><tr><td>Inside, front to back</td><td class="n">' + fmtLenBoth(HL).join(" · ") + "</td></tr>";
    for (let i = M.floors.length - 2; i >= 0; i--) h += "<tr><td>" + esc(M.floors[i].name) + " to " + esc(M.floors[i + 1].name.toLowerCase()) + ', floor to floor</td><td class="n">' + fmtLen(M.floors[i].rise) + "</td></tr>";
    h += '<tr><td>Basement floor to top ceiling</td><td class="n">' + fmtLen(top.z + top.ceiling) + "</td></tr><tr><td>Stairs</td><td class=\"n\">2 flights of " + sh.risers + " risers, treads " + fmtLen(sh.run) + "</td></tr></table></div>";
    h += "<div><h3>Reading these plans</h3><p><small>Walls are drawn at their real thickness. Sizes are inside, wall to wall; the small figures along the walls are wall lengths. The front door is at the top of every plan, the stairs on the right. Cabinets and counters are drawn light: they stand in front of the walls. Only the inside was scanned: the thickness of the outside walls (" + fmtLen(T_OUT) + ") is a usual one, not a measurement. The scanner is good to about an inch; take a tape to anything that has to fit exactly.</small></p></div></div>";
    d.insertAdjacentHTML("beforeend", h);
    // one sheet a floor, at 3/16 in to the foot
    for (const f of M.floors.slice().reverse()) {
      d = sheet();
      d.appendChild(el("h2", { text: f.name }));
      d.appendChild(el("p", { class: "lead", text: fmtArea(f.area_rooms, null, 0) + " in rooms · ceiling " + fmtLen(f.ceiling) + " · scale 3/16 in = 1 ft (1 : 64) on letter paper at 100%" }));
      const cols = el("div", { class: "cols" }), left = el("div", { style: "flex:none" }), right = el("div");
      left.appendChild(sheetSvg([f], PRINT_LAYERS, 64, true, 1.3).svg);
      let t = '<h3 style="margin-top:0">Rooms</h3><table><tr><th>Room</th><th class="n">Size</th><th class="n">Area</th></tr>' + roomRows(f) + "</table>";
      t += '<h3>Doors</h3><table><tr><th>Door</th><th class="n">Width</th></tr>';
      for (const dr of f.doors) t += "<tr><td>" + esc(dr.name) + (dr.kind !== "door" ? " <small>" + esc(doorKind(dr)) + "</small>" : "") + '</td><td class="n">' + fmtLen(dr.width) + "</td></tr>";
      t += '</table><h3>Windows</h3><table><tr><th>In</th><th class="n">Width</th><th class="n">Sill</th></tr>';
      for (const w of f.windows) t += "<tr><td>" + esc(whereOf(w)) + (w.kind !== "window" ? " <small>" + esc(w.kind) + "</small>" : "") + '</td><td class="n">' + fmtLen(w.width) + '</td><td class="n">' + fmtLen(w.sill) + "</td></tr>";
      t += "</table>";
      const notes = f.rooms.filter(r => r.note).map(r => "<b>" + esc(r.name) + ":</b> " + esc(r.note));
      if (notes.length) t += '<h3>Notes</h3><p class="fine">' + notes.join("<br>") + "</p>";
      right.innerHTML = t; cols.appendChild(left); cols.appendChild(right); d.appendChild(cols);
    }
    // last: what was put right
    d = sheet();
    d.appendChild(el("h2", { text: "How this plan was made" }));
    h = '<p class="lead">The scanner’s software drew each floor by itself from the laser points. For this plan every wall was checked against those points, and these things were put right.</p>';
    let used = 0;
    for (const c of M.corrections) {
      const cost = 3 + Math.ceil(c.was.length / 105) + Math.ceil(c.now.length / 105);     // lines this one takes
      if (used + cost > 40) { d.insertAdjacentHTML("beforeend", h); d = sheet(); d.appendChild(el("h2", { text: "How this plan was made, continued" })); h = ""; used = 0; }
      used += cost;
      h += '<div class="fix"><b>' + esc(c.floor === "all" ? "All floors" : FLOOR[c.floor].name) + ": " + esc(c.what) + '</b><div class="was">Before: ' + esc(c.was) + "</div><div>Now: " + esc(c.now) + "</div></div>";
    }
    h += "<h3>What is a guess</h3><p><small>The thickness of the outside walls. The place of doors that were shut when scanned (front door, closets): read off the relief of the wall, sized to the usual door nearest to it. The railing between the top-floor hall and the stairs, which no scan caught. Which way the two doors swing whose doorway the scanner stood in.</small></p>";
    d.insertAdjacentHTML("beforeend", h);
    sheets.forEach((s, i) => s.appendChild(el("div", { class: "foot" }, [el("span", { text: M.house.title + " · measured by lidar, " + M.house.scanned }), el("span", { text: "sheet " + (i + 1) + " of " + sheets.length })])));
    return sheets.length;
  }

  // ---- start ---------------------------------------------------------------------------------------
  theme(); header();
  has3d = GL3D.init(glEl, {
    tap: (x, y) => {
      if (S.ruler) { const s = snap3d(x, y); if (s) rulerPoint(FLOOR[s.floor], s.p); }
      else { const hit = GL3D.pick(x, y); select(hit && hit.room ? hit.room.id : null, true); }
    },
    hover: (x, y) => { if (S.ruler) { preview = snap3d(x, y); GL3D.touch(); } },
  });
  GL3D.onFrame = frame3d;
  $("rulerBtn").onclick = () => setRuler(!S.ruler);
  $("panelBtn").onclick = () => { S.panel = !S.panel; keep(); panel(); onResize(); };
  function onResize() {
    if (S.dim === "3d") GL3D.resize();
    else if (lay) { if (fitted) draw2d(true); else { const [w, h] = stageSize(); view.h = view.w * h / w; applyView(); } }
  }
  let rt = 0; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(onResize, 60); });
  if (window.matchMedia) { const mq = window.matchMedia("(prefers-color-scheme: dark)"), f = () => { if (S.theme === "auto") { theme(); GL3D.invalidate(); redraw(false); } }; if (mq.addEventListener) mq.addEventListener("change", f); }
  window.addEventListener("keydown", e => {
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if (e.key === "+" || e.key === "=") zoomBy(1 / 1.3);
    else if (e.key === "-" || e.key === "_") zoomBy(1.3);
    else if (e.key === "0") fitAll();
    else if (e.key === "r" || e.key === "R") setRuler(!S.ruler);
    else if (e.key === "2") setDim("2d"); else if (e.key === "3") setDim("3d");
    else if (e.key === "Escape") { if (pending) { pending = null; readout(); redraw(false); overlay2d(); } else if (S.ruler) setRuler(false); else if (S.sel) select(null); }
    else if (S.dim === "3d" && e.key.startsWith("Arrow")) { const c = GL3D.cam; GL3D.look(c.az + (e.key === "ArrowLeft" ? 0.12 : e.key === "ArrowRight" ? -0.12 : 0), clamp(c.el + (e.key === "ArrowUp" ? 0.08 : e.key === "ArrowDown" ? -0.08 : 0), 0.06, Math.PI / 2)); }
    else return;
    e.preventDefault();
  });
  window.addEventListener("beforeprint", () => { if (!$("print").firstChild) buildPrint(); });
  panel(); setDim(S.dim); readout();
  const small = window.innerWidth < 700;
  if (!S.sel) setTimeout(() => hint(S.dim === "3d" ? (small ? "Drag to turn · pinch to zoom · tap a room for its sizes" : "Drag to turn · scroll or pinch to zoom · tap a room for its sizes") : (small ? "Drag · pinch to zoom · tap a room for its sizes" : "Drag to move · scroll or pinch to zoom · tap a room for its sizes"), 4200), 500);
  // the page checking itself (open it with ?selftest=1): every part is run once and the outcome shown
  function selftest() {
    const out = [], ok = (name, cond) => out.push((cond ? "ok    " : "FAIL  ") + name);
    try {
      ok("the house has its three floors", M.floors.length === 3 && M.floors.every(f => f.rooms.length && f.walls2d.length));
      setDim("2d"); setFloor("top");
      ok("2D draws every room of the top floor", planEl.querySelectorAll(".room").length === FLOOR.top.rooms.length);
      S.panel = true; panel(); select("t4");
      ok("picking Room 4 shows its 145 ft²", S.sel === "t4" && /145\.1/.test($("tabbody").textContent));
      S.panel = false; panel();
      ok("with the panel shut its sizes stand on the picture", !$("roominfo").hidden && /Room 4.*145\.1.ft².*16. 8. × 9. 4./.test($("roominfo").textContent) && $("roominfo").getBoundingClientRect().height > 30);
      S.panel = true; panel();
      setRuler(true); rulerPoint(FLOOR.top, [0, 0]); rulerPoint(FLOOR.top, [HW, 0]);
      ok("the ruler measures the house's width", rulers.length === 1 && Math.abs(dist(rulers[0].a, rulers[0].b) - HW) < 1e-6 && /18. 10/.test($("readout").textContent));
      const s = snap(FLOOR.top, [0.04, 0.03], 0.1);
      ok("the ruler catches a corner", s.kind === "corner" && dist(s.p, [0, 0]) < 1e-6);
      rulers.length = 0; setRuler(false);
      setFloor("all"); ok("2D draws all three floors", planEl.querySelectorAll(".floor").length === 3);
      ok("paper: " + buildPrint() + " sheets", $("print").querySelectorAll(".sheet").length >= 5);
      ok("DXF for CAD", Export.dxf().length > 20000 && /EOF/.test(Export.dxf().slice(-8)));
      ok("CSV table", Export.csv().split("\n").length > 25);
      ok("GLB 3D model", new DataView(Export.glb()).getUint32(0, true) === 0x46546C67);
      ok("OBJ 3D model with its colours", Export.obj().length > 50000 && /newmtl walls/.test(Export.mtl()));
      ok("SVG drawing", /^<\?xml[\s\S]*<svg/.test(planSvg([FLOOR.main])));
      S.units = "metric"; ok("metres", fmtLen(HW) === "5.75 m"); S.units = "imperial"; ok("feet and inches", fmtLen(HW) === "18′ 10½″");
      setDim("3d");
      ok(has3d ? "3D draws" : "3D is not available in this browser (2D still is)", has3d ? S.dim === "3d" && (GL3D.snapshot(300, 200, {}) || "").length > 2000 : true);
      if (has3d) { GL3D.fit(false); const hit = GL3D.pick(GL3D.size()[0] / 2, GL3D.size()[1] / 2); ok("3D finds the floor under the pointer", !!hit); }
      select(null); chips(); header(); viewctl(); panel();
    } catch (e) { out.push("FAIL  an error: " + (e && e.message)); }
    return out;
  }
  if (new URLSearchParams(location.search).get("selftest")) setTimeout(() => {
    const r = selftest(), bad = r.filter(l => l.startsWith("FAIL")).length;
    document.title = "selftest: " + (r.length - bad) + " ok, " + bad + " failed";
    document.body.appendChild(el("pre", { id: "selftest", style: "position:fixed;left:12px;bottom:60px;z-index:99;margin:0;padding:10px 14px;border-radius:10px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:" + (bad ? "#7f1d1d" : "#14532d") + ";color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:calc(100% - 24px);white-space:pre-wrap",
      text: (bad ? bad + " FAILED\n" : "all " + r.length + " checks passed · " + navigator.userAgent.replace(/^.*?(Firefox\/[\d.]+|Chrome\/[\d.]+|Version\/[\d.]+ Safari).*$/, "$1") + "\n") + r.join("\n") }));
  }, 300);
  // for build.py and for anyone curious in the console
  window.House = { M, S, Export, buildPrint, planSvg, setFloor, setDim, select, setRuler, rulerPoint, redraw, GL3D, FLOOR, ROOM, panel, chips, selftest };
})();

</script>
</body>
</html>
